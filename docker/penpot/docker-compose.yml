# Penpot 2.18 en local: http://localhost:9001
# Basado en el compose oficial (penpot/penpot, docker/images). Sin telemetría,
# sin consola de administración ni MCP. Solo para pruebas en el aula.
name: penpot

x-flags: &flags
  PENPOT_FLAGS: disable-email-verification disable-secure-session-cookies enable-prepl-server
x-uri: &uri
  PENPOT_PUBLIC_URI: http://localhost:9001
x-secret: &secret
  PENPOT_SECRET_KEY: clave-solo-para-pruebas-locales
x-db: &db
  PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
  PENPOT_DATABASE_USERNAME: penpot
  PENPOT_DATABASE_PASSWORD: penpot

networks:
  penpot:

volumes:
  penpot_postgres_v15:
  penpot_assets:

services:
  penpot-frontend:
    image: penpotapp/frontend:2.18
    restart: always
    ports:
      - 9001:8080
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on: [penpot-backend, penpot-exporter]
    networks: [penpot]
    environment:
      << : [*flags, *uri]

  penpot-backend:
    image: penpotapp/backend:2.18
    restart: always
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      penpot-postgres: {condition: service_healthy}
      penpot-valkey: {condition: service_healthy}
    networks: [penpot]
    environment:
      << : [*flags, *uri, *secret, *db]
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"

  penpot-exporter:
    image: penpotapp/exporter:2.18
    restart: always
    depends_on:
      penpot-valkey: {condition: service_healthy}
    networks: [penpot]
    environment:
      << : [*flags, *uri, *secret]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-postgres:
    image: postgres:15
    restart: always
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
    volumes:
      - penpot_postgres_v15:/var/lib/postgresql/data
    networks: [penpot]
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: penpot

  penpot-valkey:
    image: valkey/valkey:8.1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    networks: [penpot]
    environment:
      VALKEY_EXTRA_FLAGS: --maxmemory 128mb --maxmemory-policy volatile-lfu